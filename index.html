<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCANIT-TRS</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#27ae60">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  margin:0;
}

.container{
  max-width:400px;
  margin:auto;
  padding:15px;
}

.title{
  text-align:center;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.progress{
  text-align:center;
  color:white;
  margin-bottom:10px;
}

.card{
  background:white;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

select,input,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:5px;
}

#list{
  max-height:180px;
  overflow-y:auto;
  background:white;
  border-radius:10px;
  display:none;
  margin-top:5px;
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.item:hover{
  background:#f1f1f1;
}

#map{
  height:220px;
  border-radius:10px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#e74c3c;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" style="
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#27ae60;color:white;
display:flex;align-items:center;justify-content:center;
font-size:22px;z-index:9999;">
SCANIT-TRS
</div>

<div class="container">

<div class="title">SCANIT-TRS</div>
<div class="progress" id="progress">0/0 selesai</div>

<div class="card">
<select id="salesman"></select>
</div>

<div class="card">
<select id="cabang"></select>
</div>

<div class="card">
<input id="search" placeholder="Cari outlet...">
<div id="list"></div>
</div>

<div class="card">
<input id="kode" placeholder="Kode Outlet" readonly>
<input id="nama" placeholder="Nama Outlet" readonly>
</div>

<div class="card">
<textarea id="alamat"></textarea>
</div>

<div class="card">
<div id="map"></div>
</div>

<div class="card">
<input type="file" id="foto">
</div>

<div class="card" id="gpsInfo">📍 GPS loading...</div>

<button onclick="kirim()">🚀 KIRIM DATA</button>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// 🔥 CONFIG (ISI PUNYAMU)
const firebaseConfig = {
  apiKey: "ISI_APIKEY",
  authDomain: "ISI",
  databaseURL: "ISI",
  projectId: "ISI"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allData={}, submitted={};
let lat=null,lng=null;
let map,marker;

// LOAD DATA
db.ref("outlets").once("value",snap=>{
  allData=snap.val()||{};

  let sSet=new Set();
  let cSet=new Set();

  Object.values(allData).forEach(d=>{
    sSet.add(d.Salesman||d.salesman);
    cSet.add(d.Cabang||d.cabang);
  });

  salesman.innerHTML="<option>Pilih Sales</option>";
  cabang.innerHTML="<option>Pilih Cabang</option>";

  sSet.forEach(s=>salesman.innerHTML+=`<option>${s}</option>`);
  cSet.forEach(c=>cabang.innerHTML+=`<option>${c}</option>`);
});

// DATA SUDAH DIKIRIM
db.ref("kunjungan").on("value",snap=>{
  submitted={};
  snap.forEach(d=>{
    submitted[d.val().kode]=true;
  });
});

// GPS
navigator.geolocation.watchPosition(async pos=>{
  lat=pos.coords.latitude;
  lng=pos.coords.longitude;

  gpsInfo.innerText="📍 GPS AKTIF";

  if(!map){
    map=L.map('map').setView([lat,lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker=L.marker([lat,lng]).addTo(map);
  }else{
    map.setView([lat,lng]);
    marker.setLatLng([lat,lng]);
  }

  try{
    let res=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
    let data=await res.json();
    alamat.value=data.display_name;
  }catch{}
},
err=>{
  gpsInfo.innerText="❌ GPS ERROR";
});

// SEARCH
search.addEventListener("focus",()=>list.style.display="block");

document.addEventListener("click",(e)=>{
  if(!e.target.closest("#search")&&!e.target.closest("#list")){
    list.style.display="none";
  }
});

search.addEventListener("input",render);
salesman.addEventListener("change",render);
cabang.addEventListener("change",render);

// RENDER
function render(){

  if(!salesman.value || !cabang.value){
    list.innerHTML="<div class='item'>Pilih dulu</div>";
    return;
  }

  let s=salesman.value;
  let c=cabang.value;
  let key=search.value.toLowerCase();

  list.innerHTML="";
  list.style.display="block";

  let total=0,done=0;

  Object.keys(allData).forEach(k=>{
    let d=allData[k];
    let nama=(d.Nama||d.nama||"").toLowerCase();
    let sales=d.Salesman||d.salesman;
    let cab=d.Cabang||d.cabang;

    if(sales==s && cab==c){
      total++;

      if(submitted[k]){done++;return;}

      if(!key || nama.includes(key)){
        list.innerHTML+=`
        <div class="item" onclick="pilih('${k}')">
          ${d.Nama||d.nama}
        </div>`;
      }
    }
  });

  progress.innerText=`${done}/${total} selesai`;
}

// PILIH
function pilih(id){
  let d=allData[id];
  kode.value=id;
  nama.value=d.Nama||d.nama;
  list.style.display="none";
}

// KIRIM
function kirim(){

  if(!kode.value){
    alert("pilih outlet dulu");
    return;
  }

  let file=foto.files[0];
  let reader=new FileReader();

  reader.onload=function(){
    let base64=reader.result;

    let data={
      salesman:salesman.value,
      cabang:cabang.value,
      kode:kode.value,
      nama:nama.value,
      alamat:alamat.value,
      lat,lng,
      foto:base64,
      waktu:new Date().toISOString()
    };

    db.ref("kunjungan").push(data);

    alert("🔥 berhasil");

    kode.value="";
    nama.value="";
    search.value="";
  };

  if(file) reader.readAsDataURL(file);
  else reader.onload();
}

// SPLASH
window.onload=()=>{
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
  },1000);
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCANIT-TRS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  color:#333;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.title{
  text-align:center;
  color:white;
  font-size:22px;
  margin-bottom:10px;
}

.progress{
  text-align:center;
  color:white;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
}

input, select, textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

#listOutlet{
  max-height:200px;
  overflow-y:auto;
  background:white;
  border-radius:10px;
  margin-top:5px;
  display:none;
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.item:hover{
  background:#f1f1f1;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#e74c3c;
  color:white;
  font-size:16px;
}

#map{
  height:200px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">SCANIT-TRS</div>
<div class="progress" id="progress">0/0 selesai</div>

<div class="card">
<select id="sales"></select>
</div>

<div class="card">
<select id="cabang"></select>
</div>

<div class="card">
<input id="search" placeholder="Cari outlet...">
<div id="listOutlet"></div>
</div>

<div class="card">
<input id="kode" placeholder="Kode Outlet" readonly>
<input id="nama" placeholder="Nama Outlet" readonly>
</div>

<div class="card">
<textarea id="alamat" placeholder="Alamat"></textarea>
</div>

<div class="card">
<div id="map"></div>
</div>

<div class="card">
<input type="file" id="foto">
</div>

<div class="card" id="gpsStatus">📍 GPS loading...</div>

<button onclick="kirim()">🚀 KIRIM DATA</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotagging-system",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 GLOBAL
let outlets = {};
let filtered = [];
let selected = null;

// 🔥 LOAD DATA
db.ref("outlets").once("value", snap=>{
  const data = snap.val();

  Object.keys(data).forEach(k=>{
    const o = data[k];
    outlets[k] = {
      kode:o.Kode,
      nama:o.Nama,
      cabang:o.Cabang,
      sales:o.Salesman
    };
  });

  initDropdown();
});

// 🔥 INIT DROPDOWN
function initDropdown(){
  const salesSet = new Set();
  const cabangSet = new Set();

  Object.values(outlets).forEach(o=>{
    salesSet.add(o.sales);
    cabangSet.add(o.cabang);
  });

  const sales = document.getElementById("sales");
  const cabang = document.getElementById("cabang");

  sales.innerHTML = `<option>Pilih Sales</option>`;
  cabang.innerHTML = `<option>Pilih Cabang</option>`;

  salesSet.forEach(s=> sales.innerHTML += `<option>${s}</option>`);
  cabangSet.forEach(c=> cabang.innerHTML += `<option>${c}</option>`);

  sales.onchange = filterData;
  cabang.onchange = filterData;
}

// 🔥 FILTER
function filterData(){
  const s = sales.value;
  const c = cabang.value;

  filtered = Object.values(outlets).filter(o=>{
    return (!s || o.sales===s) && (!c || o.cabang===c);
  });

  renderList(filtered);
}

// 🔥 SEARCH
search.oninput = ()=>{
  const q = search.value.toLowerCase();

  const result = filtered.filter(o =>
    o.nama.toLowerCase().includes(q) ||
    o.kode.toLowerCase().includes(q)
  );

  renderList(result);
};

// 🔥 RENDER LIST
function renderList(arr){
  const list = document.getElementById("listOutlet");
  list.style.display="block";

  list.innerHTML = arr.map(o=>`
    <div class="item" onclick="pilih('${o.kode}')">
      ${o.kode} - ${o.nama}
    </div>
  `).join("");
}

// 🔥 PILIH
function pilih(kode){
  const o = Object.values(outlets).find(x=>x.kode===kode);
  selected = o;

  kodeInput.value = o.kode;
  nama.value = o.nama;

  listOutlet.style.display="none";
}

// 🔥 GPS + MAP
let lat,lng;
const map = L.map('map').setView([-7.7,110.5], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

navigator.geolocation.getCurrentPosition(pos=>{
  lat = pos.coords.latitude;
  lng = pos.coords.longitude;

  document.getElementById("gpsStatus").innerText="📍 GPS AKTIF";

  map.setView([lat,lng],16);
  L.marker([lat,lng]).addTo(map);

}, err=>{
  document.getElementById("gpsStatus").innerText="❌ GPS gagal";
});

// 🔥 KIRIM
function kirim(){
  if(!selected) return alert("Pilih outlet dulu");

  db.ref("checkin").push({
    ...selected,
    lat,
    lng,
    waktu:new Date().toISOString()
  });

  alert("🔥 sukses");
}
</script>

</body>
</html>

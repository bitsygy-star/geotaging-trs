<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOTAGGING SYSTEM</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#2ecc71,#27ae60);
  margin:0;
  padding:20px;
  color:#333;
}

.container {
  max-width:400px;
  margin:auto;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
}

input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#27ae60;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:disabled {
  background:gray;
}
</style>

</head>
<body>

<div class="container">

<h2 style="text-align:center;color:white;">GEOTAGGING SYSTEM</h2>

<div class="card">
<label>Salesman</label>
<input id="salesman">
</div>

<div class="card">
<label>Cabang</label>
<input id="cabang">
</div>

<div class="card">
<label>Customer</label>
<input id="customer">
</div>

<div class="card">
<label>Alamat</label>
<input id="alamat">
</div>

<button id="btnKirim" onclick="kirimData()">KIRIM DATA</button>

</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// 🔥 CONFIG FIREBASE (SUDAH FIX)
const firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotagging-system",
  storageBucket: "geotagging-system.firebasestorage.app",
  messagingSenderId: "954782185667",
  appId: "1:954782185667:web:96ee2d0726a2708f39ca76"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
// 🔥 GPS
let latitude = null;
let longitude = null;

navigator.geolocation.getCurrentPosition(
  (pos) => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;
    console.log("GPS:", latitude, longitude);
  },
  (err) => {
    alert("GPS gagal: " + err.message);
  }
);

// 🔥 KIRIM DATA
function kirimData(){

  const btn = document.getElementById("btnKirim");
  btn.disabled = true;
  btn.innerText = "Loading...";

  const salesman = document.getElementById("salesman").value;
  const cabang = document.getElementById("cabang").value;
  const customer = document.getElementById("customer").value;
  const alamat = document.getElementById("alamat").value;

  // VALIDASI
  if(!salesman || !cabang || !customer || !alamat){
    alert("❌ Semua field wajib diisi!");
    btn.disabled = false;
    btn.innerText = "KIRIM DATA";
    return;
  }

  if(latitude === null){
    alert("❌ GPS belum aktif");
    btn.disabled = false;
    btn.innerText = "KIRIM DATA";
    return;
  }

  const data = {
    salesman: salesman,
    cabang: cabang,
    customer: customer,
    alamat: alamat,
    lat: latitude,
    lng: longitude,
    waktu: new Date().toISOString()
  };

  db.ref("data").push(data)
    .then(() => {
      alert("🔥 Data masuk Firebase!");

      // reset form
      document.getElementById("salesman").value = "";
      document.getElementById("cabang").value = "";
      document.getElementById("customer").value = "";
      document.getElementById("alamat").value = "";

      btn.disabled = false;
      btn.innerText = "KIRIM DATA";
    })
    .catch(err => {
      alert("❌ Error: " + err.message);
      btn.disabled = false;
      btn.innerText = "KIRIM DATA";
    });

}
</script>

</body>
</html>

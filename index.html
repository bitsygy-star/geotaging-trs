<script>
// ================= FIREBASE =================
firebase.initializeApp({
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = firebase.database();

// ================= GLOBAL =================
let outlets = {};
let listData = [];
let selectedKode = null;
let doneList = JSON.parse(localStorage.getItem("done")||"[]");

// ================= LOAD DATA =================
db.ref("outlets").once("value").then(snap=>{
  const data = snap.val();

  for(let k in data){
    const o = data[k];

    outlets[k] = {
      kode: o.Kode || o.kode,
      nama: o.Nama || o.nama,
      cabang: o.Cabang || o.cabang,
      sales: o.Salesman || o.salesman
    };
  }

  initSales(); // 🔥 mulai dari sales dulu
});

// ================= SALES DROPDOWN =================
function initSales(){
  const salesEl = document.getElementById("sales");

  let sSet = new Set();

  Object.values(outlets).forEach(o=>{
    if(o.sales) sSet.add(o.sales);
  });

  salesEl.innerHTML = `<option>Pilih Sales</option>`;

  sSet.forEach(s=>{
    salesEl.innerHTML += `<option>${s}</option>`;
  });
}

// ================= AUTO CABANG =================
sales.onchange = function(){

  const selectedSales = this.value;

  let cabangSet = new Set();

  Object.values(outlets).forEach(o=>{
    if(o.sales === selectedSales){
      cabangSet.add(o.cabang);
    }
  });

  cabang.innerHTML = `<option>Pilih Cabang</option>`;

  cabangSet.forEach(c=>{
    cabang.innerHTML += `<option>${c}</option>`;
  });

  listData = [];
};

// ================= FILTER OUTLET =================
cabang.onchange = function(){

  const s = sales.value;
  const c = cabang.value;

  listData = Object.values(outlets).filter(o=>{
    return o.sales === s && o.cabang === c;
  });

  // 🔥 HIDE YANG SUDAH DIINPUT
  listData = listData.filter(o=> !doneList.includes(o.kode));

  updateProgress();
};

// ================= SEARCH =================
search.oninput = function(){

  const q = this.value.toLowerCase();

  if(!q){
    list.style.display="none";
    return;
  }

  const result = listData.filter(o=>
    o.nama.toLowerCase().includes(q) ||
    o.kode.toLowerCase().includes(q)
  );

  list.style.display="block";

  list.innerHTML = result.map(o=>`
    <div class="item" onclick="pilih('${o.kode}')">
      ${o.kode} - ${o.nama}
    </div>
  `).join("");
};

// ================= PILIH =================
function pilih(kode){

  const o = listData.find(x=>x.kode === kode);

  selectedKode = kode;

  document.getElementById("kode").value = o.kode;
  document.getElementById("nama").value = o.nama;

  list.style.display="none";
}

// ================= PROGRESS =================
function updateProgress(){
  progress.innerText = `${doneList.length}/${listData.length} selesai`;
}

// ================= KIRIM =================
function kirim(){

  if(!selectedKode){
    alert("Pilih outlet dulu!");
    return;
  }

  const file = foto.files[0];

  if(!file){
    alert("Foto wajib!");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){

    const data = {
      kode:selectedKode,
      nama:nama.value,
      sales:sales.value,
      cabang:cabang.value,
      alamat:alamat.value,
      lat,lng,
      foto:reader.result,
      waktu:new Date().toISOString()
    };

    db.ref("transaksi").push(data);

    // 🔥 SIMPAN PROGRESS
    doneList.push(selectedKode);
    localStorage.setItem("done", JSON.stringify(doneList));

    alert("✅ Data tersimpan");

    location.reload();
  };

  reader.readAsDataURL(file);
}
</script>

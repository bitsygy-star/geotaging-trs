<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOTAGGING SYSTEM</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#2ecc71,#27ae60);
  margin:0;
  padding:20px;
  color:#333;
}

.container {
  max-width:400px;
  margin:auto;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
}

input, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#27ae60;
  color:white;
  font-size:16px;
}
</style>

</head>
<body>

<div class="container">

<h2 style="text-align:center;color:white;">GEOTAGGING SYSTEM</h2>

<div class="card">
<label>Salesman</label>
<input id="salesman">
</div>

<div class="card">
<label>Cabang</label>
<input id="cabang">
</div>

<div class="card">
<label>Customer</label>
<input id="customer">
</div>

<div class="card">
<label>Alamat</label>
<input id="alamat">
</div>

<button onclick="kirimData()">KIRIM DATA</button>

</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.firebaseio.com/",
  projectId: "geotagging-system",
  storageBucket: "geotagging-system.firebasestorage.app",
  messagingSenderId: "954782185667",
  appId: "1:954782185667:web:96ee2d0726a2708f39ca76"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
// 🔥 AMBIL GPS
let latitude = 0;
let longitude = 0;

navigator.geolocation.getCurrentPosition(
  (pos) => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;
    console.log("GPS:", latitude, longitude);
  },
  (err) => {
    alert("GPS gagal: " + err.message);
  }
);

// 🔥 KIRIM DATA
function kirimData(){

  const data = {
    salesman: document.getElementById("salesman").value,
    cabang: document.getElementById("cabang").value,
    customer: document.getElementById("customer").value,
    alamat: document.getElementById("alamat").value,
    lat: latitude,
    lng: longitude,
    waktu: new Date().toISOString()
  };

  db.ref("data").push(data)
    .then(() => {
      alert("🔥 Data masuk Firebase!");
    })
    .catch(err => {
      alert("Error: " + err);
    });

}
</script>

</body>
</html>

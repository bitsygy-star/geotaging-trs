<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SCANIT-TRS</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(180deg,#16a34a,#22c55e);
}

.header{
  text-align:center;
  color:white;
  padding:15px;
  font-weight:bold;
}

.app{
  max-width:420px;
  margin:auto;
  padding:10px;
}

.card{
  background:#f1f5f9;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
}

label{
  font-size:13px;
  color:#334155;
}

select,input,textarea{
  width:100%;
  padding:12px;
  margin-top:5px;
  border-radius:10px;
  border:1px solid #cbd5e1;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#ef4444;
  color:white;
  font-weight:bold;
}

.progress{
  text-align:center;
  color:white;
  font-weight:bold;
  margin-bottom:10px;
}
</style>

</head>

<body>

<div class="header">SCANIT-TRS GEOTAGGING</div>
<div class="progress" id="progress">0 / 0 outlet selesai</div>

<div class="app">

  <div class="card">
    <label>Salesman</label>
    <select id="salesman"></select>
  </div>

  <div class="card">
    <label>Cabang</label>
    <input type="text" id="cabang" readonly>
  </div>

  <div class="card">
    <label>Outlet</label>
    <select id="outlet"></select>
  </div>

  <div class="card">
    <label>Kode Outlet</label>
    <input type="text" id="kode_outlet" readonly>
  </div>

  <div class="card">
    <label>Alamat</label>
    <textarea id="alamat" readonly></textarea>
  </div>

  <div class="card">
    <label>Map</label>
    <div id="map" style="height:200px;border-radius:10px;"></div>
  </div>

  <div class="card">
    <label>Foto</label>
    <input type="file" id="foto" accept="image/*" capture="environment">
    <img id="preview" style="width:100%;margin-top:10px;border-radius:10px;display:none;">
  </div>

  <button onclick="kirimData()">🚀 SEND VALIDATION</button>

</div>

<script>
// ================= FIREBASE =================
var firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotagging-system",
  storageBucket: "geotagging-system.firebasestorage.app",
  messagingSenderId: "954782185667",
  appId: "1:954782185667:web:96ee2d0726a2708f39ca76"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= GLOBAL =================
let map;
window.latitude = "";
window.longitude = "";
window.fotoBase64 = "";

// ================= LOAD SALESMAN =================
function loadSalesman(){
  db.ref("outlets").once("value", (snap)=>{
    const data = snap.val();
    let set = new Set();

    for(let k in data){
      set.add(data[k].salesman);
    }

    let select = document.getElementById("salesman");
    select.innerHTML = '<option value="">Pilih</option>';

    set.forEach(s=>{
      let o = document.createElement("option");
      o.value = s;
      o.textContent = s;
      select.appendChild(o);
    });
  });
}

// ================= PILIH SALESMAN =================
document.getElementById("salesman").addEventListener("change", function(){

  let val = this.value;

  db.ref("outlets").once("value", (snap)=>{
    const data = snap.val();

    let outlet = document.getElementById("outlet");
    outlet.innerHTML = '<option value="">Pilih</option>';

    let cabang = "";

    for(let k in data){
      let d = data[k];

      if(d.salesman === val){
        cabang = d.cabang;

        let o = document.createElement("option");
        o.value = k;
        o.textContent = k + " - " + d.nama;
        outlet.appendChild(o);
      }
    }

    document.getElementById("cabang").value = cabang;
    updateProgress();
  });

});

// ================= PILIH OUTLET =================
document.getElementById("outlet").addEventListener("change", function(){
  document.getElementById("kode_outlet").value = this.value;
});

// ================= GPS =================
function ambilLokasi(){
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    window.latitude = lat;
    window.longitude = lng;

    tampilkanMap(lat,lng);

    let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    let data = await res.json();

    document.getElementById("alamat").value = data.display_name;
  });
}

// ================= MAP =================
function tampilkanMap(lat,lng){
  if(map){
    map.setView([lat,lng],16);
    return;
  }

  map = L.map('map').setView([lat,lng],16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
  }).addTo(map);

  L.marker([lat,lng]).addTo(map);
}

// ================= FOTO =================
document.getElementById("foto").addEventListener("change", function(e){
  let file = e.target.files[0];

  if(file){
    let reader = new FileReader();

    reader.onload = function(ev){
      document.getElementById("preview").src = ev.target.result;
      document.getElementById("preview").style.display = "block";
      window.fotoBase64 = ev.target.result;
    };

    reader.readAsDataURL(file);
  }
});

// ================= KIRIM =================
function kirimData(){

  let salesman = document.getElementById("salesman").value;
  let cabang = document.getElementById("cabang").value;
  let outlet = document.getElementById("outlet").value;
  let alamat = document.getElementById("alamat").value;

  if(!salesman || !outlet){
    alert("Lengkapi data!");
    return;
  }

  db.ref("kunjungan").push({
    salesman,
    cabang,
    outlet,
    alamat,
    lat:window.latitude,
    lng:window.longitude,
    foto:window.fotoBase64,
    waktu:new Date().toISOString()
  });

  // simpan local
  let hist = JSON.parse(localStorage.getItem("kunjungan"))||[];
  hist.push(outlet);
  localStorage.setItem("kunjungan",JSON.stringify(hist));

  alert("Berhasil 🔥");

  updateProgress();
}

// ================= PROGRESS =================
function updateProgress(){
  let hist = JSON.parse(localStorage.getItem("kunjungan"))||[];
  let total = document.getElementById("outlet").options.length - 1;

  document.getElementById("progress").innerText =
    hist.length + " / " + total + " outlet selesai";
}

// ================= INIT =================
loadSalesman();
ambilLokasi();

</script>

</body>
</html>

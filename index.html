<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCANIT-TRS</title>

<!-- MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  margin:0;
}

.container{
  max-width:400px;
  margin:auto;
  padding:15px;
}

.title{
  text-align:center;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.progress{
  text-align:center;
  color:white;
  margin-bottom:10px;
}

.card{
  background:white;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
}

select,input,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:5px;
}

#list{
  max-height:180px;
  overflow-y:auto;
  background:white;
  border-radius:10px;
  display:none;
  margin-top:5px;
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.item:hover{
  background:#f1f1f1;
}

#map{
  height:200px;
  border-radius:10px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#e74c3c;
  color:white;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" style="
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#27ae60;color:white;
display:flex;align-items:center;justify-content:center;
font-size:22px;z-index:9999;">
SCANIT-TRS
</div>

<div class="container">

<div class="title">SCANIT-TRS</div>
<div class="progress" id="progress">0/0 selesai</div>

<div class="card">
<select id="salesman"><option>Loading...</option></select>
</div>

<div class="card">
<select id="cabang"><option>Loading...</option></select>
</div>

<div class="card">
<input id="search" placeholder="Cari outlet...">
<div id="list"></div>
</div>

<div class="card">
<input id="kode" placeholder="Kode Outlet" readonly>
<input id="nama" placeholder="Nama Outlet" readonly>
</div>

<div class="card">
<textarea id="alamat"></textarea>
</div>

<div class="card">
<div id="map"></div>
</div>

<div class="card">
<input type="file" id="foto">
</div>

<div class="card" id="gpsInfo">📍 GPS loading...</div>

<button onclick="kirim()">🚀 KIRIM DATA</button>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
console.log("APP START");

// 🔥 CONFIG LU (SUDAH BENER DARI SEBELUMNYA)
const firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotagging-system",
  storageBucket: "geotagging-system.appspot.com",
  messagingSenderId: "954782185667",
  appId: "1:954782185667:web:96ee2d0726a2708f39ca76"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allData = {};
let submitted = {};
let lat=null, lng=null;
let map, marker;

// 🔥 LOAD DATA OUTLET
db.ref("outlets").once("value", snap=>{
  allData = snap.val() || {};

  console.log("DATA:", allData);

  let sSet=new Set();
  let cSet=new Set();

  Object.values(allData).forEach(d=>{
    sSet.add(d.Salesman);
    cSet.add(d.Cabang);
  });

  salesman.innerHTML="<option>Pilih Sales</option>";
  cabang.innerHTML="<option>Pilih Cabang</option>";

  sSet.forEach(s=>salesman.innerHTML+=`<option>${s}</option>`);
  cSet.forEach(c=>cabang.innerHTML+=`<option>${c}</option>`);
});

// 🔥 DATA SUDAH DIISI
db.ref("kunjungan").on("value", snap=>{
  submitted={};
  snap.forEach(d=>{
    submitted[d.val().kode]=true;
  });
});

// 🔥 GPS
navigator.geolocation.watchPosition(pos=>{
  lat=pos.coords.latitude;
  lng=pos.coords.longitude;

  gpsInfo.innerText="📍 GPS AKTIF";

  if(!map){
    map=L.map('map').setView([lat,lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker=L.marker([lat,lng]).addTo(map);
  }else{
    marker.setLatLng([lat,lng]);
  }
}, err=>{
  gpsInfo.innerText="❌ GPS ERROR";
});

// 🔥 SEARCH
search.addEventListener("input", render);
salesman.addEventListener("change", render);
cabang.addEventListener("change", render);

function render(){

  if(!salesman.value || !cabang.value) return;

  let s=salesman.value;
  let c=cabang.value;
  let key=search.value.toLowerCase();

  list.innerHTML="";
  list.style.display="block";

  let total=0,done=0;

  Object.keys(allData).forEach(k=>{
    let d=allData[k];
    let nama=d.Nama.toLowerCase();

    if(d.Salesman==s && d.Cabang==c){
      total++;

      if(submitted[k]){done++; return;}

      if(!key || nama.includes(key)){
        list.innerHTML+=`
        <div class="item" onclick="pilih('${k}')">
          ${d.Nama}
        </div>`;
      }
    }
  });

  progress.innerText=`${done}/${total} selesai`;
}

function pilih(id){
  let d=allData[id];
  kode.value=id;
  nama.value=d.Nama;
  list.style.display="none";
}

// 🔥 KIRIM
function kirim(){

  if(!kode.value){
    alert("Pilih outlet dulu!");
    return;
  }

  let file=foto.files[0];
  let reader=new FileReader();

  reader.onload=function(){
    let data={
      salesman:salesman.value,
      cabang:cabang.value,
      kode:kode.value,
      nama:nama.value,
      alamat:alamat.value,
      lat,lng,
      foto:reader.result,
      waktu:new Date().toISOString()
    };

    db.ref("kunjungan").push(data);

    alert("🔥 sukses");

    kode.value="";
    nama.value="";
    search.value="";
  };

  if(file) reader.readAsDataURL(file);
  else reader.onload();
}

// 🔥 SPLASH FIX (ANTI NYANGKUT)
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
},1500);
</script>

</body>
</html>

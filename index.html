<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SCANIT-TRS PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<!-- MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(180deg,#16a34a,#22c55e);
}
.header{
  text-align:center;
  color:white;
  padding:15px;
  font-weight:bold;
}
.app{
  max-width:420px;
  margin:auto;
  padding:10px;
}
.card{
  background:#f1f5f9;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
}
label{font-size:13px;color:#334155}
select,input,textarea{
  width:100%;padding:12px;margin-top:5px;
  border-radius:10px;border:1px solid #cbd5e1;
}
button{
  width:100%;padding:14px;border:none;
  border-radius:12px;background:#ef4444;color:white;font-weight:bold;
}
.progress{
  text-align:center;color:white;font-weight:bold;margin-bottom:10px;
}
#loginBox{
  padding:20px;text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h3>LOGIN SALESMAN</h3>
  <input type="text" id="username" placeholder="Nama Salesman">
  <button onclick="login()">MASUK</button>
</div>

<div id="mainApp" style="display:none;">

<div class="header">SCANIT-TRS GEOTAGGING</div>
<div class="progress" id="progress">0 / 0 outlet selesai</div>

<button onclick="logout()" style="margin:10px;">🔓 Ganti User</button>

<div class="app">

  <div class="card">
    <label>Salesman</label>
    <select id="salesman"></select>
  </div>

  <div class="card">
    <label>Cabang</label>
    <input type="text" id="cabang" readonly>
  </div>

  <div class="card">
    <label>Search Outlet</label>
    <input type="text" id="searchOutlet" placeholder="Cari outlet...">
  </div>

  <div class="card">
    <label>Outlet</label>
    <select id="outlet"></select>
  </div>

  <div class="card">
    <label>Kode Outlet</label>
    <input type="text" id="kode_outlet" readonly>
  </div>

  <div class="card">
    <label>Alamat</label>
    <textarea id="alamat" readonly></textarea>
  </div>

  <div class="card">
    <label>Map</label>
    <div id="map" style="height:200px;border-radius:10px;"></div>
  </div>

  <div class="card">
    <label>Foto</label>
    <input type="file" id="foto" accept="image/*" capture="environment">
    <img id="preview" style="width:100%;margin-top:10px;border-radius:10px;display:none;">
  </div>

  <button onclick="kirimData()">🚀 VALIDASI</button>

</div>

</div>

<script>
// ================= FIREBASE =================
var firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotagging-system",
  storageBucket: "geotagging-system.firebasestorage.app",
  messagingSenderId: "954782185667",
  appId: "1:954782185667:web:96ee2d0726a2708f39ca76"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

// ================= GLOBAL =================
let map;
let fileFoto;
let userLat, userLng;
let semuaOutlet = [];

// ================= LOGIN =================
function login(){
  let user = document.getElementById("username").value;

  if(!user){
    alert("Isi nama!");
    return;
  }

  localStorage.setItem("user", user);

  document.getElementById("loginBox").style.display="none";
  document.getElementById("mainApp").style.display="block";

  loadSalesman(user);
  ambilLokasi();
}

function logout(){
  localStorage.removeItem("user");
  location.reload();
}

// AUTO LOGIN
window.onload = function(){
  let user = localStorage.getItem("user");
  if(user){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("mainApp").style.display="block";
    loadSalesman(user);
    ambilLokasi();
  }
};

// ================= LOAD SALESMAN =================
function loadSalesman(user){
  db.ref("outlets").once("value",(snap)=>{
    let data = snap.val();
    let set = new Set();

    for(let k in data){
      set.add(data[k].salesman);
    }

    let select = document.getElementById("salesman");
    select.innerHTML="";

    set.forEach(s=>{
      let o=document.createElement("option");
      o.value=s;
      o.textContent=s;
      if(s===user) o.selected=true;
      select.appendChild(o);
    });

    // LOCK
    select.disabled = true;
    document.getElementById("cabang").readOnly = true;

    select.dispatchEvent(new Event("change"));
  });
}

// ================= FILTER OUTLET =================
document.getElementById("salesman").addEventListener("change", function(){

  let val=this.value;

  db.ref("outlets").once("value",(snap)=>{
    let data=snap.val();

    semuaOutlet = [];

    let cabang="";

    for(let k in data){
      let d=data[k];

      if(d.salesman===val){
        cabang=d.cabang;

        semuaOutlet.push({
          kode:k,
          nama:d.nama
        });
      }
    }

    document.getElementById("cabang").value=cabang;

    renderOutlet(semuaOutlet);
    updateProgress();
  });

});

// ================= RENDER OUTLET =================
function renderOutlet(list){

  let outlet = document.getElementById("outlet");
  outlet.innerHTML = '<option value="">Pilih</option>';

  let hist = JSON.parse(localStorage.getItem("kunjungan")) || [];

  list.forEach(o=>{

    if(hist.includes(o.kode)) return;

    let opt = document.createElement("option");
    opt.value = o.kode;
    opt.textContent = o.kode + " - " + o.nama;

    outlet.appendChild(opt);
  });

}

// ================= SEARCH =================
document.getElementById("searchOutlet").addEventListener("input", function(){

  let keyword = this.value.toLowerCase();

  let hasil = semuaOutlet.filter(o =>
    o.kode.toLowerCase().includes(keyword) ||
    o.nama.toLowerCase().includes(keyword)
  );

  renderOutlet(hasil);
});

// ================= OUTLET =================
document.getElementById("outlet").addEventListener("change", function(){
  document.getElementById("kode_outlet").value = this.value;
  document.getElementById("searchOutlet").value = "";
});

// ================= GPS =================
function ambilLokasi(){
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    userLat=pos.coords.latitude;
    userLng=pos.coords.longitude;

    tampilkanMap(userLat,userLng);

    let res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`);
    let data=await res.json();

    document.getElementById("alamat").value=data.display_name;
  });
}

// ================= MAP =================
function tampilkanMap(lat,lng){
  if(map){
    map.setView([lat,lng],16);
    return;
  }

  map=L.map('map').setView([lat,lng],16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  L.marker([lat,lng]).addTo(map);
}

// ================= FOTO =================
document.getElementById("foto").addEventListener("change",(e)=>{
  fileFoto=e.target.files[0];

  if(fileFoto){
    let url=URL.createObjectURL(fileFoto);
    preview.src=url;
    preview.style.display="block";
  }
});

// ================= UPLOAD FOTO =================
async function processAndUploadFoto(){

  if(!fileFoto) return "";

  return new Promise((resolve)=>{

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();
      img.src = e.target.result;

      img.onload = async function(){

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // 🔥 resize
        const MAX_WIDTH = 800;
        let scale = MAX_WIDTH / img.width;

        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // 🔥 WATERMARK
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

        ctx.fillStyle = "white";
        ctx.font = "12px Arial";

        const waktu = new Date().toLocaleString();
        const gps = `Lat:${userLat?.toFixed(5)} Lng:${userLng?.toFixed(5)}`;

        ctx.fillText(waktu, 10, canvas.height - 35);
        ctx.fillText(gps, 10, canvas.height - 15);

        // 🔥 convert ke blob
        canvas.toBlob(async (blob)=>{

          let ref = storage.ref("foto/"+Date.now()+".jpg");

          await ref.put(blob);

          let url = await ref.getDownloadURL();

          resolve(url);

        }, "image/jpeg", 0.7);
      }
    };

    reader.readAsDataURL(fileFoto);
  });
}

// ================= KIRIM =================
let isUploading = false;

async function kirimData(){

  if(isUploading){
    alert("Tunggu bro, lagi upload...");
    return;
  }

  let salesman = document.getElementById("salesman").value;
  let outlet = document.getElementById("outlet").value;

  if(!salesman || !outlet){
    alert("Lengkapi data!");
    return;
  }

  // ❌ CEK SUDAH VALIDASI
  let hist = JSON.parse(localStorage.getItem("kunjungan"))||[];

  if(hist.includes(outlet)){
    alert("Outlet sudah divalidasi ❌");
    return;
  }

  try{
    isUploading = true;

    alert("⏳ Uploading...");

    let fotoURL = await processAndUploadFoto();

    await db.ref("kunjungan").push({
      salesman,
      outlet,
      lat:userLat,
      lng:userLng,
      foto:fotoURL,
      waktu:new Date().toISOString()
    });

    // simpan local
    hist.push(outlet);
    localStorage.setItem("kunjungan",JSON.stringify(hist));

    alert("✅ VALIDASI BERHASIL");

    renderOutlet(semuaOutlet);
    updateProgress();

  }catch(e){
    console.error(e);
    alert("❌ Upload gagal");
  }

  isUploading = false;
}

// ================= PROGRESS =================
function updateProgress(){
  let hist=JSON.parse(localStorage.getItem("kunjungan"))||[];
  let total=document.getElementById("outlet").options.length-1;

  document.getElementById("progress").innerText=
    hist.length+" / "+total+" outlet selesai";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">

<title>GEOTAGGING SYSTEM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body{
  height:100%;
  margin:0;
  padding:0;
}

body{
  font-family:Segoe UI;
  background:linear-gradient(#22c55e,#6ee7b7);
  display:flex;
  flex-direction:column;
}

.header{
  background:#16a34a;
  color:white;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.progress{
  text-align:center;
  color:white;
  font-weight:bold;
  margin:5px 0;
}

.container{
  flex:1;
  max-width:400px;
  width:100%;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

select,input,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-size:16px;
}

button.loading{
  animation: blink 0.6s infinite;
}

@keyframes blink{
  0%{background:#ef4444;}
  50%{background:#dc2626;}
  100%{background:#ef4444;}
}

#map{
  height:200px;
  border-radius:10px;
}

.status{
  text-align:center;
  font-size:13px;
  margin-top:5px;
  font-weight:bold;
}

.footer{
  background:#16a34a;
  text-align:center;
  color:white;
  font-size:12px;
  padding:10px;
}
</style>

</head>

<body>

<div class="header">SCANIT-TRS GEOTAGING</div>
<div class="progress" id="progress">Firebase Ready</div>

<div class="container">

<div class="card">
<label>🙍‍♂️ Salesman</label>
<select id="salesman">
<option>budi</option>
<option>andi</option>
<option>sasa</option>
</select>
</div>

<div class="card">
<label>🏬 Cabang</label>
<select id="cabang">
<option>SOLO</option>
<option>JOGJA</option>
<option>SEMARANG</option>
</select>
</div>

<div class="card">
<label>🏪 Customer</label>
<input id="customer" placeholder="Input customer">
</div>

<div class="card">
<label>📌 Alamat</label>
<textarea id="alamat"></textarea>
</div>

<div class="card">
<label>📍 Map</label>
<div id="map"></div>
</div>

<div class="card">
<label>📸 Foto</label>
<input type="file" id="foto" accept="image/*" capture="environment">
</div>

<div class="card">
<button id="btn" onclick="kirim()">🚀 SEND VALIDATION</button>
<div class="status" id="status">Menunggu GPS...</div>
</div>

</div>

<div class="footer">Powered by BITS-YGY</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAlsxlwijg09MpYc5ZTaPbtu8-ruPK5X4I",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotagging-system",
  storageBucket: "geotagging-system.firebasestorage.app",
  messagingSenderId: "954782185667",
  appId: "1:954782185667:web:96ee2d0726a2708f39ca76"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<!-- 🔥 MAP -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let lat,lng,map;

navigator.geolocation.getCurrentPosition(async pos=>{

  lat = pos.coords.latitude;
  lng = pos.coords.longitude;

  document.getElementById("status").innerText = "📍 GPS SIAP";

  map = L.map('map').setView([lat,lng],15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  L.marker([lat,lng]).addTo(map);

  let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
  let data = await res.json();

  document.getElementById("alamat").value = data.display_name;

});

// 🔥 KIRIM DATA KE FIREBASE
async function kirim(){

  let btn = document.getElementById("btn");
  btn.classList.add("loading");

  let file = document.getElementById("foto").files[0];

  if(!file){
    alert("Foto wajib!");
    btn.classList.remove("loading");
    return;
  }

  let reader = new FileReader();

  reader.onload = async function(){

    const data = {
      salesman: document.getElementById("salesman").value,
      cabang: document.getElementById("cabang").value,
      customer: document.getElementById("customer").value,
      lat: lat,
      lng: lng,
      alamat: document.getElementById("alamat").value,
      foto: reader.result,
      waktu: new Date().toISOString()
    };

    try{
      await db.ref("geotagging").push(data);

      btn.classList.remove("loading");
      alert("🔥 DATA MASUK FIREBASE!");
      location.reload();

    }catch(err){
      btn.classList.remove("loading");
      alert("❌ ERROR: " + err.message);
    }

  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>

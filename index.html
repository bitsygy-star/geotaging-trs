<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCANIT-TRS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.title{
  text-align:center;
  color:white;
  font-size:22px;
}

.progress{
  text-align:center;
  color:white;
}

.card{
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:5px;
}

#list{
  max-height:200px;
  overflow:auto;
  display:none;
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.item:hover{
  background:#f1f1f1;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#e74c3c;
  color:white;
}

#map{
  height:200px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">SCANIT-TRS</div>
<div class="progress" id="progress">0/0 selesai</div>

<div class="card">
<select id="sales"></select>
</div>

<div class="card">
<select id="cabang"></select>
</div>

<div class="card">
<input id="search" placeholder="Cari outlet...">
<div id="list"></div>
</div>

<div class="card">
<input id="kode" placeholder="Kode Outlet" readonly>
<input id="nama" placeholder="Nama Outlet" readonly>
</div>

<div class="card">
<textarea id="alamat" placeholder="Alamat otomatis"></textarea>
</div>

<div class="card">
<div id="map"></div>
</div>

<div class="card">
<input type="file">
</div>

<div class="card" id="gps">📍 GPS loading...</div>

<button onclick="kirim()">🚀 KIRIM DATA</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "geotagging-system.firebaseapp.com",
  databaseURL: "https://geotagging-system-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let outlets = {};
let listData = [];
let selected = null;

// 🔥 LOAD DATA + CLEAN
db.ref("outlets").once("value", snap=>{
  const data = snap.val();

  Object.keys(data).forEach(k=>{
    const o = data[k];

    // 🔥 FILTER DATA KOTOR
    if(
      !o ||
      !o.Salesman ||
      !o.Cabang ||
      !o.Kode ||
      !o.Nama
    ) return;

    outlets[k]={
      kode:o.Kode,
      nama:o.Nama,
      cabang:o.Cabang,
      sales:o.Salesman
    };
  });

  initDropdown();
});

// 🔥 DROPDOWN
function initDropdown(){
  const sSet=new Set();
  const cSet=new Set();

  Object.values(outlets).forEach(o=>{
    if(o.sales) sSet.add(o.sales);
    if(o.cabang) cSet.add(o.cabang);
  });

  sales.innerHTML="<option value=''>Pilih Sales</option>";
  cabang.innerHTML="<option value=''>Pilih Cabang</option>";

  sSet.forEach(s=>{
    if(s !== "undefined")
      sales.innerHTML += `<option>${s}</option>`;
  });

  cSet.forEach(c=>{
    cabang.innerHTML += `<option>${c}</option>`;
  });
}

// 🔥 FILTER
function filter(){
  const s = sales.value;
  const c = cabang.value;

  listData = Object.values(outlets).filter(o=>{
    return (!s || o.sales===s) && (!c || o.cabang===c);
  });
}

// 🔥 SEARCH
search.oninput=()=>{
  filter();

  const q=search.value.toLowerCase();

  const result=listData.filter(o=>
    o.nama.toLowerCase().includes(q) ||
    o.kode.toLowerCase().includes(q)
  );

  render(result);
};

// 🔥 RENDER LIST
function render(arr){
  list.style.display="block";

  if(arr.length===0){
    list.innerHTML="<div class='item'>Tidak ditemukan</div>";
    return;
  }

  list.innerHTML=arr.map(o=>`
    <div class="item" onclick="pilih('${o.kode}')">
      ${o.kode} - ${o.nama}
    </div>
  `).join("");
}

// 🔥 PILIH OUTLET
function pilih(k){
  const o=Object.values(outlets).find(x=>x.kode===k);

  selected=o;

  kode.value=o.kode;
  nama.value=o.nama;

  list.style.display="none";
}

// 🔥 MAP + GPS + AUTO ALAMAT
let lat,lng;

const map=L.map('map').setView([-7.7,110.5],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

navigator.geolocation.getCurrentPosition(async pos=>{
  lat=pos.coords.latitude;
  lng=pos.coords.longitude;

  gps.innerText="📍 GPS AKTIF";

  map.setView([lat,lng],16);
  L.marker([lat,lng]).addTo(map);

  // 🔥 AUTO ALAMAT
  const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
  const data = await res.json();

  alamat.value = data.display_name;

}, err=>{
  gps.innerText="❌ GPS gagal";
});

// 🔥 KIRIM
function kirim(){
  if(!selected) return alert("Pilih outlet dulu");

  db.ref("checkin").push({
    ...selected,
    lat,
    lng,
    waktu:new Date().toISOString()
  });

  alert("🔥 Data berhasil dikirim");
}
</script>

</body>
</html>

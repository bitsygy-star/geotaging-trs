<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCANIT-TRS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  color:#fff;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

h2{
  text-align:center;
  margin-bottom:5px;
}

.progress{
  text-align:center;
  margin-bottom:15px;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
}

select,input,textarea{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

textarea{
  resize:none;
}

#list{
  background:#fff;
  max-height:180px;
  overflow:auto;
  border-radius:10px;
  display:none;
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.item:hover{
  background:#f1f1f1;
}

#map{
  height:200px;
  border-radius:12px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#e74c3c;
  color:#fff;
  font-size:16px;
}

.status{
  text-align:center;
  margin-top:10px;
  background:#fff;
  color:#333;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>SCANIT-TRS</h2>
<div class="progress" id="progress">0/0 selesai</div>

<div class="card">
<select id="sales">
<option>Pilih Sales</option>
</select>
</div>

<div class="card">
<input id="cabang" placeholder="Cabang otomatis" readonly>
</div>

<div class="card">
<input id="search" placeholder="Cari outlet...">
<div id="list"></div>
</div>

<div class="card">
<input id="kode" placeholder="Kode Outlet" readonly>
<input id="nama" placeholder="Nama Outlet" readonly>
</div>

<div class="card">
<textarea id="alamat" placeholder="Alamat"></textarea>
</div>

<div class="card">
<div id="map"></div>
</div>

<div class="card">
<input type="file" id="foto">
</div>

<div class="status" id="gps">GPS loading...</div>

<button onclick="kirim()">🚀 KIRIM DATA</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI_PROJECT.firebaseapp.com",
  databaseURL: "ISI_DATABASE_URL",
  projectId: "ISI_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= ELEMENT =================
const sales = document.getElementById("sales");
const cabang = document.getElementById("cabang");
const search = document.getElementById("search");
const list = document.getElementById("list");
const kode = document.getElementById("kode");
const nama = document.getElementById("nama");
const alamat = document.getElementById("alamat");
const progress = document.getElementById("progress");

// ================= DATA =================
let outlets = {};
let listData = [];
let doneList = JSON.parse(localStorage.getItem("done")||"[]");

// ================= LOAD DATA =================
db.ref("outlets").once("value", snap => {

  let data = snap.val();

  for(let k in data){
    let o = data[k];

    if(!o) continue;

    outlets[k] = {
      kode: o.kode || "",
      nama: o.nama || "",
      cabang: o.cabang || "",
      sales: o.salesman || ""
    };
  }

  loadSales();
});

// ================= LOAD SALES =================
function loadSales(){
  let s = [...new Set(Object.values(outlets).map(o=>o.sales))];

  sales.innerHTML = `<option>Pilih Sales</option>` + 
    s.map(x=>`<option>${x}</option>`).join("");
}

// ================= SALES CHANGE =================
sales.onchange = () => {

  let first = Object.values(outlets).find(o => o.sales === sales.value);

  if(first){
    cabang.value = first.cabang;
  }

  listData = Object.values(outlets)
    .filter(o => o.sales === sales.value)
    .filter(o => !doneList.includes(o.kode));

  updateProgress();
};

// ================= SEARCH =================
search.oninput = () => {

  let q = search.value.toLowerCase();

  if(!q){
    list.style.display="none";
    return;
  }

  let res = listData.filter(o =>
    (o.nama && o.nama.toLowerCase().includes(q)) ||
    (o.kode && o.kode.toLowerCase().includes(q))
  );

  list.style.display="block";

  list.innerHTML = res.map(o =>
    `<div class="item" onclick="pilih('${o.kode}')">
      ${o.kode} - ${o.nama}
    </div>`
  ).join("");
};

// ================= PILIH =================
function pilih(k){
  let o = listData.find(x=>x.kode===k);

  if(!o) return;

  kode.value = o.kode;
  nama.value = o.nama;

  list.style.display="none";
}

// ================= GPS =================
let map = L.map('map').setView([-7.5,110.7],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker;

navigator.geolocation.getCurrentPosition(pos => {

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  marker = L.marker([lat,lng]).addTo(map);
  map.setView([lat,lng],15);

  alamat.value = lat + "," + lng;
  document.getElementById("gps").innerText = "📍 GPS AKTIF";

});

// ================= PROGRESS =================
function updateProgress(){
  let total = listData.length + doneList.length;
  progress.innerText = `${doneList.length}/${total} selesai`;
}

// ================= KIRIM =================
function kirim(){

  if(!kode.value) return alert("Pilih outlet dulu");

  let data = {
    kode: kode.value,
    nama: nama.value,
    cabang: cabang.value,
    sales: sales.value,
    alamat: alamat.value,
    waktu: new Date().toISOString()
  };

  db.ref("validasi").push(data);

  doneList.push(kode.value);
  localStorage.setItem("done", JSON.stringify(doneList));

  alert("Berhasil kirim");

  location.reload();
}

</script>

</body>
</html>
